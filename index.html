<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Shrike</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #c0392b;
      --grey: #888888;
      --dark: #1a1a1a;
      --light: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%;
      height: 100vh;
      background: var(--light);
      color: var(--dark);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 580px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 270px;
      height: auto;
      margin-bottom: 0;
      opacity: 0.96;
    }

    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--grey);
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    }

    .tagline span { color: var(--red); }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--grey);
      margin: 22px auto;
      opacity: 0;
      animation: fadeUp 1s ease 0.75s forwards;
    }

    .launch {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 1s ease 0.9s forwards;
    }

    .contact {
      font-size: 12.5px;
      letter-spacing: 0.06em;
      line-height: 2;
      opacity: 0;
      animation: fadeUp 1s ease 1.05s forwards;
    }

    a { color: var(--dark); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--red); }
  </style>
</head>

<body>
  <div class="container">
    <img src="shrike_LOGO.png" alt="Data Shrike Logo" class="logo">

    <p class="tagline">
      Scalable broadcast graphics systems &amp; 3D visualization for sports media.
    </p>

    <div class="divider"></div>

    <div class="launch">Launching Summer 2026</div>

    <div class="contact">
      <div><a href="mailto:info@data-shrike.com">info@data-shrike.com</a></div>
      <div><a href="https://linkedin.com/company/data-shrike">linkedin.com/company/data-shrike</a></div>
    </div>
  </div>
</body>
</html>
